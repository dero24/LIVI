# rtw88 USB WiFi stability (TP-Link T2U Nano / RTL8811AU, driver rtw88_8821au)
#
# The driver's periodic watchdog (rtw_watch_dog_work -> IQ calibration / TX
# power tracking) does synchronous USB register reads. If the firmware has
# entered deep link-power-save (LPS), it deadlocks on the rtwdev->mutex and
# wedges the USB bus — taking down every device on the same controller
# (including the touchscreen). Symptom: full system hang, fixed only by
# unplugging the dongle or rebooting.
#
# USB autosuspend was already disabled (usbcore.autosuspend=-1 + udev rule),
# but that does NOT stop the driver's OWN deep LPS. This module option does.
options rtw88_core disable_lps_deep=1
