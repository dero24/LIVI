# Disable WiFi power-save globally (all interfaces, persistent across reboots).
#
# Two separate problems fixed here:
# 1. wlan0 (built-in brcmfmac): with power_save on, the Pi becomes unreachable
#    on the LAN after a few idle minutes even though it shows "connected".
#    (The runtime `iw dev wlan0 set power_save off` done previously does NOT
#    survive reboots — this does.)
# 2. wlan1 (rtw88 dongle): driver-level power management is one of the three
#    triggers of the rtw88 USB bus wedge/hang.
#
# wifi.powersave: 2 = disable, 3 = enable. conf.d is read alphabetically,
# so this zz- file wins over any default-wifi-powersave-on.conf.
[connection]
wifi.powersave = 2
