<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <title>LIVI</title>
    <style>
      html,
            body,
            #root,
            #main,
            #videoContainer {
              margin: 0;
              padding: 0;
              width: 100vw;
              height: 100vh;
              overflow: hidden;
              background-color: #000000;
            }

            #main {
              display: grid;
              grid-template-columns: 74px auto;
            }

            #main-root {
              max-width: 100%;
              min-width: 0;
            }

            #nav-root {
              width: 75px;
            }

            /* Video underlay (compositor on Linux, NSView on mac) */
            html.show-video,
            html.show-video body,
            html.show-video #root,
            html.show-video #main,
            html.show-video #videoContainer,
            html.show-cluster,
            html.show-cluster body,
            html.show-cluster #root,
            html.show-cluster #main,
            html.show-cluster #videoContainer,
            html.show-cluster #telemetry-root {
              background-color: transparent;
            }

            /* [hub] §12.2: touch passthrough — when AA video is showing AND
               the hub shell is in AA mode (not landing), touches must pass
               through #content-root to reach the projection-root (z-0) below.
               The 'show-video' class is toggled by Projection.tsx when
               receivingVideo. The 'hub-aa-mode' class is toggled by HubShell
               when viewMode becomes 'aa' (user entered AA).

               Reliability note: we do NOT mutate #content-root's inline style
               from JS — that was racey because hubd presence updates can
               flicker `anyProjecting`, which toggled the inline style and let
               #content-root (pointer-events: auto by default) briefly capture
               touches meant for the video plane. Instead the class below is
               the single source of truth, and it is driven by a latched
               (hysteresis) projecting signal in HubShell so a one-frame
               presence blip cannot disable passthrough. #projection-root and
               #videoContainer re-enable pointer-events explicitly so the
               cascade from #content-root:none does not swallow them, and only
               elements marked .hub-interactive inside #hub-shell-root stay
               tappable (the bar, health dot, ring banner, gear, back button). */
            html.hub-aa-mode #content-root {
              pointer-events: none;
            }
            html.hub-aa-mode #projection-root,
            html.hub-aa-mode #videoContainer {
              pointer-events: auto;
            }
            html.hub-aa-mode #hub-shell-root {
              pointer-events: none;
            }
            html.hub-aa-mode #hub-shell-root .hub-interactive {
              pointer-events: auto;
            }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
