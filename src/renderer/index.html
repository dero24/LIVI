<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <title>LIVI</title>
    <style>
      html,
            body,
            #root,
            #main,
            #videoContainer {
              margin: 0;
              padding: 0;
              width: 100vw;
              height: 100vh;
              overflow: hidden;
              background-color: #000000;
            }

            #main {
              display: grid;
              grid-template-columns: 74px auto;
            }

            #main-root {
              max-width: 100%;
              min-width: 0;
            }

            #nav-root {
              width: 75px;
            }

            /* Video underlay (compositor on Linux, NSView on mac) */
            html.show-video,
            html.show-video body,
            html.show-video #root,
            html.show-video #main,
            html.show-video #videoContainer,
            html.show-cluster,
            html.show-cluster body,
            html.show-cluster #root,
            html.show-cluster #main,
            html.show-cluster #videoContainer,
            html.show-cluster #telemetry-root {
              background-color: transparent;
            }

            /* [hub] §12.2: touch passthrough — when projecting AND viewing AA,
               touches must pass through #content-root to reach the projection-root
               (z-0) below. Toggled via CSS class on <html> + inline style on
               #content-root. The bar and interactive children override with
               pointer-events:auto. */
            html.hub-touch-passthrough #content-root {
              pointer-events: none;
            }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
